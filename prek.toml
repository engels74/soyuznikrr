# Configuration for `prek`, a fast Rust-based pre-commit alternative.
# See https://prek.j178.dev/configuration/ for full reference.
#:schema https://www.schemastore.org/prek.json

# Built-in hooks (no external repo clone required).
[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "check-merge-conflict" },
    { id = "check-case-conflict" },
    { id = "check-added-large-files", args = ["--maxkb=500"] },
    { id = "detect-private-key" },
    { id = "check-json", exclude = '^frontend/.*tsconfig.*\.json$' },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "no-commit-to-branch", args = ["--branch", "main"] },
]

# Python linting and formatting with Ruff.
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.13"
hooks = [
    { id = "ruff-check", args = ["--fix"], files = '^backend/(src|tests)/.*\.py$' },
    { id = "ruff-format", files = '^backend/(src|tests)/.*\.py$' },
]

# Conventional Commits — enforce commit message format.
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
    { id = "conventional-pre-commit", stages = ["commit-msg"] },
]

# Secret / credential leak guard — fixtures and dotfiles must never carry tokens.
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
    { id = "gitleaks" },
]

# Local hooks: project-specific quality gates that reuse existing tooling.
[[repos]]
repo = "local"

# Biome: format + lint frontend JS/TS/Svelte/JSON/CSS.
[[repos.hooks]]
id = "biome"
name = "Format and lint with Biome"
entry = "./frontend/node_modules/.bin/biome check --write"
language = "system"
types_or = ["javascript", "ts", "svelte", "json", "css"]
files = '^frontend/'
exclude = '^frontend/(build|\.svelte-kit|node_modules)/'

# Frontend TypeScript / Svelte check (svelte-check). Pre-push only.
[[repos.hooks]]
id = "typecheck-ts"
name = "TypeScript Check"
entry = "bun run --cwd frontend check"
language = "system"
pass_filenames = false
files = '^frontend/.*\.(ts|svelte)$'
stages = ["pre-push"]

# Backend Python type checking (basedpyright). Pre-push only.
[[repos.hooks]]
id = "typecheck-py"
name = "Python Type Check (basedpyright)"
entry = "bash -c 'cd backend && uv run basedpyright'"
language = "system"
files = '^backend/(src|tests)/.*\.py$'
pass_filenames = false
stages = ["pre-push"]

# Backend pytest suite. Pre-push only.
[[repos.hooks]]
id = "tests-py"
name = "Python Tests"
entry = "bash -c 'cd backend && uv run pytest'"
language = "system"
files = '^backend/(src|tests)/.*\.py$'
pass_filenames = false
stages = ["pre-push"]

# Frontend test suite (vitest). Pre-push only.
[[repos.hooks]]
id = "tests-ts"
name = "Frontend Tests"
entry = "bun run --cwd frontend test"
language = "system"
files = '^frontend/.*\.(ts|svelte)$'
pass_filenames = false
stages = ["pre-push"]
